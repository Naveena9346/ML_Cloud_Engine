apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlcloudengine-backend
  labels:
    app: mlcloudengine-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mlcloudengine-backend
  template:
    metadata:
      labels:
        app: mlcloudengine-backend
    spec:
      containers:
      - name: backend
        image: mlcloudengine/backend:v1.0.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: mlcloudengine-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: mlcloudengine-backend-svc
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: mlcloudengine-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mlcloudengine-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mlcloudengine-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
