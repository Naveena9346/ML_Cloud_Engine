version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mlcloudengine-db
    restart: always
    environment:
      POSTGRES_USER: mlengine
      POSTGRES_PASSWORD: mlengine_secure_pass
      POSTGRES_DB: mlcloudengine_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mlcloudengine-redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: mlcloudengine-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: mlcloudengine-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: mlcloudengine-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
